name: Laravel CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================================
  # TESTS
  # ==========================================================

  tests:
    name: Tests Laravel

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:

      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_pgsql
          coverage: none

      - name: Installer Composer
        run: |
          composer install \
            --no-interaction \
            --prefer-dist

      - name: Préparer Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Nettoyer la configuration
        run: |
          php artisan config:clear

      - name: Vérifier PostgreSQL
        run: |
          pg_isready \
            -h 127.0.0.1 \
            -p 5432 \
            -U postgres

      - name: Préparer la base
        run: |
          php artisan migrate:fresh --force

      - name: Tests
        run: |
          php artisan test


  # ==========================================================
  # QUALITY
  # ==========================================================

  quality:
    name: Quality Gate

    runs-on: ubuntu-latest

    needs: tests

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Installer Composer
        run: |
          composer install \
            --no-interaction \
            --prefer-dist

      - name: Vérifier Pint
        run: |
          ./vendor/bin/pint --test

      - name: Vérifier PHPStan
        run: |
          ./vendor/bin/phpstan analyse
