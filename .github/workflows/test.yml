name: Tests Task

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier les variables DB
        run: |
          test -n "$DB_DATABASE" || {
            echo "DB_DATABASE est vide"
            exit 1
          }

          test -n "$DB_USERNAME" || {
            echo "DB_USERNAME est vide"
            exit 1
          }

          test -n "$DB_PASSWORD" || {
            echo "DB_PASSWORD est vide"
            exit 1
          }

          echo "Variables DB présentes"

      - name: Préparer Laravel
        run: |
          cp .env.example .env

          sed -i "s/^DB_DATABASE=.*/DB_DATABASE=${DB_DATABASE}/" .env
          sed -i "s/^DB_USERNAME=.*/DB_USERNAME=${DB_USERNAME}/" .env
          sed -i "s/^DB_PASSWORD=.*/DB_PASSWORD=${DB_PASSWORD}/" .env

          sed -i "s/^DB_HOST=.*/DB_HOST=postgres/" .env
          sed -i "s/^DB_PORT=.*/DB_PORT=5432/" .env

      - name: Construire et démarrer les services
        run: |
          docker compose up -d --build

      - name: Vérifier les services
        run: |
          docker compose ps

      - name: Attendre PostgreSQL
        run: |
          until docker compose exec -T postgres \
            pg_isready \
            -U "$DB_USERNAME" \
            -d "$DB_DATABASE"
          do
            echo "PostgreSQL n'est pas encore prêt..."
            sleep 2
          done

          echo "PostgreSQL est prêt"

      - name: Vérifier Laravel
        run: |
          docker compose exec -T app php artisan --version

      - name: Générer la clé Laravel
        run: |
          docker compose exec -T app php artisan key:generate --force

      - name: Nettoyer les caches Laravel
        run: |
          docker compose exec -T app php artisan config:clear
          docker compose exec -T app php artisan cache:clear

      - name: Migrations
        run: |
          docker compose exec -T app \
            php artisan migrate:fresh --force

      - name: Tests
        run: |
          docker compose exec -T app \
            php artisan test

      - name: Logs en cas d'échec
        if: failure()
        run: |
          docker compose logs

      - name: Arrêter les services
        if: always()
        run: |
          docker compose down -v
