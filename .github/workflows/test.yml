name: CI

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérification
        run: |
          echo "Début du test"

          test 1 -eq 2

          echo "Cette ligne ne sera jamais exécutée"
