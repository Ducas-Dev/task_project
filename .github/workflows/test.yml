name: Tests Task

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    env:
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier les variables
        run: |
          test -n "$DB_DATABASE" || (echo "DB_DATABASE est vide" && exit 1)
          test -n "$DB_USERNAME" || (echo "DB_USERNAME est vide" && exit 1)
          test -n "$DB_PASSWORD" || (echo "DB_PASSWORD est vide" && exit 1)
          echo "Variables DB présentes"

      - name: Construire et démarrer les services
        run: docker compose up -d --build

      - name: Vérifier les services
        run: docker compose ps

      - name: Attendre PostgreSQL
        run: |
          until docker compose exec -T postgres pg_isready -U "$DB_USERNAME" -d "$DB_DATABASE"; do
            echo "PostgreSQL n'est pas encore prêt..."
            sleep 2
          done

      - name: Préparer Laravel
        run: |
          docker compose exec -T app php artisan key:generate
          docker compose exec -T app php artisan config:clear

      - name: Migrations
        run: docker compose exec -T app php artisan migrate:fresh --force

      - name: Tests
        run: docker compose exec -T app php artisan test

      - name: Logs
        if: failure()
        run: docker compose logs

      - name: Arrêter les services
        if: always()
        run: docker compose down -v
