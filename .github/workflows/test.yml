name: Tests Task

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:

  preparation:
    name: Préparation
    runs-on: ubuntu-latest

    env:
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier les variables d'environnement
        run: |
          test -n "$APP_KEY" || {
            echo "APP_KEY est vide"
            exit 1
          }

          test -n "$DB_DATABASE" || {
            echo "DB_DATABASE est vide"
            exit 1
          }

          test -n "$DB_USERNAME" || {
            echo "DB_USERNAME est vide"
            exit 1
          }

          test -n "$DB_PASSWORD" || {
            echo "DB_PASSWORD est vide"
            exit 1
          }

          echo "Variables nécessaires présentes"

  infrastructure:
    name: Infrastructure Docker
    runs-on: ubuntu-latest
    needs: preparation

    env:
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire et démarrer les services
        run: |
          docker compose up -d --build

      - name: Vérifier les services
        run: |
          docker compose ps

      - name: Attendre PostgreSQL
        run: |
          until docker compose exec -T postgres \
            pg_isready \
            -U "$DB_USERNAME" \
            -d "$DB_DATABASE"
          do
            echo "PostgreSQL n'est pas encore prêt..."
            sleep 2
          done

          echo "PostgreSQL est prêt"

  laravel:
    name: Validation Laravel
    runs-on: ubuntu-latest
    needs: infrastructure

    env:
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Construire et démarrer les services
        run: |
          docker compose up -d --build

      - name: Vérifier la version Laravel
        run: |
          docker compose exec -T app \
            php artisan --version

      - name: Vérifier la configuration Laravel
        run: |
          docker compose exec -T app \
            php artisan config:clear

      - name: Vérifier la connexion PostgreSQL
        run: |
          docker compose exec -T app \
            php artisan db:show

  backend-tests:
    name: Tests Laravel
    runs-on: ubuntu-latest
    needs: laravel

    env:
      APP_KEY: ${{ secrets.APP_KEY }}
      DB_DATABASE: ${{ secrets.DB_DATABASE }}
      DB_USERNAME: ${{ secrets.DB_USERNAME }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Démarrer les services
        run: |
          docker compose up -d

      - name: Exécuter les migrations
        run: |
          docker compose exec -T app \
            php artisan migrate:fresh --force

      - name: Exécuter les tests Laravel
        run: |
          docker compose exec -T app \
            php artisan test

  playwright:
  name: Tests Playwright
  runs-on: ubuntu-latest
  needs: backend-tests

  steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Installer PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mbstring, pdo, pdo_mysql
        coverage: none

    - name: Installer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: npm

    - name: Installer les dépendances PHP
      run: composer install --no-interaction --prefer-dist --optimize-autoloader

    - name: Générer la clé Laravel
      run: php artisan key:generate

    - name: Installer les dépendances JavaScript
      run: npm ci

    - name: Installer les navigateurs Playwright
      run: npx playwright install --with-deps

    - name: Lancer les tests Playwright
      run: npx playwright test

  cleanup:
    name: Nettoyage
    runs-on: ubuntu-latest
    needs:
      - infrastructure
      - laravel
      - backend-tests
      - playwright

    if: always()

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Afficher les logs en cas d'échec
        if: failure()
        run: |
          docker compose logs

      - name: Arrêter les services
        if: always()
        run: |
          docker compose down -v
