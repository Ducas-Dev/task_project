name: CI

on:
  push:
    branches:
      - main

jobs:

  environment:
    name: Découvrir GitHub Actions

    runs-on: ubuntu-latest

    steps:

      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Afficher le système
        run: |
          echo "=== Système ==="
          uname -a

      - name: Afficher PHP
        run: |
          echo "=== PHP ==="
          php --version

      - name: Afficher Git
        run: |
          echo "=== Git ==="
          git --version

      - name: Afficher Docker
        run: |
          echo "=== Docker ==="
          docker --version

      - name: Afficher le projet
        run: |
          echo "=== Projet ==="
          pwd
          ls -la
