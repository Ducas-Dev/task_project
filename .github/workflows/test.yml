name: Laravel CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================================
  # TESTS
  # ==========================================================

  tests:
    name: Tests Laravel
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16

        env:
          POSTGRES_DB: testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: postgres
      DB_PASSWORD: postgres

    steps:

      # --------------------------------------------------------
      # Checkout
      # --------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # PHP
      # --------------------------------------------------------

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo, pdo_pgsql
          coverage: none
          tools: composer

      # --------------------------------------------------------
      # Node.js
      # --------------------------------------------------------

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      # --------------------------------------------------------
      # Composer
      # --------------------------------------------------------

      - name: Installer les dépendances PHP
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

      # --------------------------------------------------------
      # NPM
      # --------------------------------------------------------

      - name: Installer les dépendances JavaScript
        run: npm ci

      # --------------------------------------------------------
      # Build Vite
      # --------------------------------------------------------

      - name: Construire les assets Vite
        run: npm run build

      # --------------------------------------------------------
      # Laravel
      # --------------------------------------------------------

      - name: Préparer Laravel
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Nettoyer la configuration
        run: |
          php artisan config:clear

      # --------------------------------------------------------
      # PostgreSQL
      # --------------------------------------------------------

      - name: Vérifier PostgreSQL
        run: |
          pg_isready \
            -h 127.0.0.1 \
            -p 5432 \
            -U postgres

      # --------------------------------------------------------
      # Database
      # --------------------------------------------------------

      - name: Préparer la base de données
        run: |
          php artisan migrate:fresh --force

      # --------------------------------------------------------
      # Tests
      # --------------------------------------------------------

      - name: Tests Laravel
        run: |
          php artisan test


  # ==========================================================
  # QUALITY
  # ==========================================================

  quality:
    name: Quality Gate
    runs-on: ubuntu-latest

    needs: tests

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # PHP
      # --------------------------------------------------------

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
          tools: composer

      # --------------------------------------------------------
      # Composer
      # --------------------------------------------------------

      - name: Installer les dépendances PHP
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader

      # --------------------------------------------------------
      # Laravel Pint
      # --------------------------------------------------------

      - name: Vérifier Pint
        run: |
          ./vendor/bin/pint 

      # --------------------------------------------------------
      # PHPStan / Larastan
      # --------------------------------------------------------

      - name: Installer PHPStan et Larastan
        run: |
          composer install --dev --no-interaction --prefer-dist

      - name: PHPStan
        run: |
          ./vendor/bin/phpstan analyse app


  # ==========================================================
  # DOCKER BUILD
  # ==========================================================

  build:
    name: Build Docker
    runs-on: ubuntu-latest

    needs:
      - tests
      - quality

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérifier Docker
        run: |
          docker --version

      - name: Construire l'image
        run: |
          docker build \
            -f docker/php/Dockerfile \
            -t task-app:${{ github.sha }} \
            .

      - name: Vérifier l'image
        run: |
          docker image inspect \
            task-app:${{ github.sha }}
